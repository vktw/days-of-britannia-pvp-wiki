name: Validate Atlas PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dob-atlas-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Antes de qualquer passo que gere arquivos (ex.: fetch_youtube.py),
      # para o escopo medir só o que o PR mudou.
      - name: Guard home layout
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if [[ "${{ github.head_ref }}" == codex/reconciliacao-* ]]; then
            python scripts/audit_home_layout.py --base FETCH_HEAD --auto-scope
          else
            python scripts/audit_home_layout.py --base FETCH_HEAD || echo "::warning::Estrutura da home mudou; esperado só em PRs de layout."
          fi

      - name: Audit documentation
        run: python scripts/audit_wiki.py

      - name: Refresh YouTube list
        run: python scripts/fetch_youtube.py

      - name: Audit bilingual parity
        run: python scripts/audit_localization.py

      - name: Audit site contract
        run: python scripts/audit_site_contract.py

      - name: Audit fact registry
        run: python scripts/audit_fact_registry.py

      - name: Build strict site
        run: mkdocs build --strict --clean

      - name: Advisory audit rendered site
        continue-on-error: true
        run: python scripts/audit_rendered_site.py
