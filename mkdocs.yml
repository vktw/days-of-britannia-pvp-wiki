site_name: Days of Britannia PvP
site_description: Manual oficial das regras de PvP de Days of Britannia
site_url: https://vktw.github.io/days-of-britannia-pvp-wiki/
repo_url: https://github.com/vktw/days-of-britannia-pvp-wiki
repo_name: vktw/days-of-britannia-pvp-wiki
copyright: Days of Britannia
strict: true
theme:
  name: material
  language: pt-BR
  favicon: assets/favicon.png
  logo: assets/logo.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.tooltips
  palette:
    scheme: dob
extra_css:
  - stylesheets/extra.css
plugins:
  - search:
      lang: pt
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
nav:
  - Inicio: index.md
  - Personagem: personagem.md
  - Combate:
      - Melee e Archery: combate/melee-archery.md
      - Armor e Parrying: combate/armor-parrying.md
      - Exemplos de dano: combate/exemplos-dano.md
      - Magery: combate/magery.md
      - Cura e recursos: combate/cura-recursos.md
      - Poison: combate/poison.md
  - Arena: arena.md
  - Comandos: comandos.md
  - Sistemas desativados: sistemas-desativados.md
  - Em teste: em-teste.md
  - Patch notes: patches.md
