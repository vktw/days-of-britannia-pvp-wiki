site_name: Days of Britannia Wiki
site_description: Manual oficial do servidor Days of Britannia
site_url: https://dobshard.com/
copyright: Days of Britannia
strict: true
theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  favicon: assets/favicon.png?v=20260724.1
  logo: assets/logo.png?v=20260724.1
  font: false
  features:
    - navigation.top
    - search.highlight
    - content.tooltips
  palette:
    scheme: dob
extra:
  dob_version: "Alpha 0.26.3"
extra_css:
  - stylesheets/extra.css?v=20260813.14
extra_javascript:
  - scripts/dob.js?v=20260813.8
plugins:
  - search:
      lang:
        - pt
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: pt-BR
          default: true
          name: Português
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Inicio: Home
            Primeiros passos: Getting started
            Comece aqui: Start here
            Ultima Online Brasil: Ultima Online Brasil
            Newcomer e proteção: Newcomer and protection
            Morte e recuperação: Death and recovery
            Nujelm Safe Haven: Nujelm Safe Haven
            Spawns raros: Rare spawns
            Whispers of Britannia: Whispers of Britannia
            PvP: PvP
            Como funciona o PvP: How PvP works
            Craft: Craft
            Visão geral: Overview
            Alchemy: Alchemy
            Blacksmithy: Blacksmithy
            Bowcraft: Bowcraft
            Carpentry: Carpentry
            Cartography: Cartography
            Cooking: Cooking
            Glassblowing: Glassblowing
            Inscription: Inscription
            Masonry: Masonry
            Tailoring: Tailoring
            Tinkering: Tinkering
            Armas clássicas: Classic weapons
            Armaduras clássicas: Classic armor
            Consumíveis, ferramentas e utilidades: Consumables, tools, and utilities
            Recompensas PvM: PvM rewards
            Arena e treinamento: Arena and training
            Sistemas: Systems
            Sistemas habilitados: Enabled systems
            Achievements: Achievements
            Maestria PvM: PvM Mastery
            Daily Dungeon: Daily Dungeon
            Comandos: Commands
            Atualizações: Updates
            Próximo patch planejado: Planned next patch
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: false
nav:
  - Inicio: index.md
  - Primeiros passos:
      - Comece aqui: primeiros-passos/index.md
      - Newcomer e proteção: primeiros-passos/newcomer.md
      - Morte e recuperação: primeiros-passos/morte-recuperacao.md
      - DoB Razor: primeiros-passos/dob-razor.md
      - Ultima Online Brasil: primeiros-passos/ultima-online-brasil.md
  # As páginas antigas de conexão, primeira hora e personagem permanecem fora
  # do menu para preservar URLs publicados; seu conteúdo canônico está em Comece aqui.
  # personagem.md também permanece fora do menu; links de Primeiros passos apontam
  # para a referência detalhada quando stats, buffs, raça ou Stealth forem necessários.
  - PvP:
      - Como funciona o PvP: combate/index.md
  - Craft:
      - Visão geral: craft/index.md
      - Alchemy: craft/alchemy.md
      - Blacksmithy: craft/blacksmithy.md
      - Bowcraft: craft/bowcraft.md
      - Carpentry: craft/carpentry.md
      - Cartography: craft/cartography.md
      - Cooking: craft/cooking.md
      - Glassblowing: craft/glassblowing.md
      - Inscription: craft/inscription.md
      - Masonry: craft/masonry.md
      - Tailoring: craft/tailoring.md
      - Tinkering: craft/tinkering.md
  - Sistemas:
      - Visão geral: sistemas/index.md
      - Sistemas habilitados: sistemas/habilitados.md
      - Achievements: sistemas/achievements.md
      - Maestria PvM: sistemas/pvm-mastery.md
      - Daily Dungeon: sistemas/daily-dungeon.md
      - Arena e treinamento: arena.md
      - Recompensas PvM: itens/recompensas-pvm.md
      - Nujelm Safe Haven: mundo/nujelm.md
      - Threat Rating: mundo/threat-rating.md
      - Spawns raros: sistemas/spawns-raros.md
      - Whispers of Britannia: sistemas/whispers-britannia.md
  # Os URLs mundo/ permanecem estáveis para links publicados; o antigo hub
  # Mundo, as páginas gerais e threat-inventory ficam fora do menu por compatibilidade.
  - Comandos: comandos.md
  - Atualizações:
      - Patch notes: patches.md
      - Próximo patch planejado: proximo-patch.md
